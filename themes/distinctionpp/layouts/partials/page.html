<article id="{{ .Type }}-{{ with .File }}{{ .UniqueID }}{{ end }}" class="article-panel reading-panel article article-type-{{ .Type }}" itemscope itemprop="blogPage">
  <div class="article-panel-inner">
    <header class="article-header">{{ partial "post/title.html" . }}</header>
    <div class="article-entry" itemprop="articleBody">{{ .Content }}</div>
    {{ partial "ads/slot.html" (dict "page" . "kind" "page") }}
  </div>
</article>
